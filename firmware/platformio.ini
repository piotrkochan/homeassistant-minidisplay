[platformio]
default_envs = sdpro

[common]
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TOUCH_CS=-1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D SPI_FREQUENCY=40000000

[esp8266_display]
build_flags =
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=LOW

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200

[env:sdpro]
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
build_flags =
  ${common.build_flags}
  ${esp8266_display.build_flags}
  -D HARDWARE_PROFILE_SDPRO=1
  -D TFT_CS=-1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1

; Profile reported by bvweerd/geekmagic-tv-esp8266.
; Same no-CS wiring as SD PRO. Not tested on our hardware.
[env:geekmagic_smalltv_nocs]
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${common.build_flags}
  ${esp8266_display.build_flags}
  -D HARDWARE_PROFILE_GEEKMAGIC_NOCS=1
  -D TFT_CS=-1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON=1

; Profile reported by giovi321/smalltv-mod for original SmallTV/Ultra.
; GPIO15 drives CS and panel uses RGB order. Not tested on our hardware.
[env:geekmagic_smalltv_cs15]
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
  ${common.build_flags}
  ${esp8266_display.build_flags}
  -D HARDWARE_PROFILE_GEEKMAGIC_CS15=1
  -D TFT_CS=15
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_OFF=1

; ESP32-C2 / ESP8684 SmallTV with onboard USB serial. Not hardware tested.
[env:geekmagic_smalltv_esp32c2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = arduino
board_build.f_flash = 60000000L
board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_4mb_ota.csv
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  moononournation/GFX Library for Arduino@^1.5.0
  adafruit/Adafruit GFX Library@^1.12.1
build_flags =
  ${common.build_flags}
  -D HARDWARE_PROFILE_GEEKMAGIC_ESP32C2=1
  -D TFT_MOSI=6
  -D TFT_SCLK=4
  -D TFT_DC=5
  -D TFT_RST=1
  -D TFT_CS=-1
  -D TFT_BL=18
  -D TFT_BACKLIGHT_ON=LOW
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1

; GeekMagic SmallTV Pro, classic ESP32, 8 MB flash. Not hardware tested.
[env:geekmagic_smalltv_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.filesystem = littlefs
board_build.partitions = partitions/smalltv_8mb_ota.csv
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  moononournation/GFX Library for Arduino@^1.5.0
  adafruit/Adafruit GFX Library@^1.12.1
build_flags =
  ${common.build_flags}
  -D HARDWARE_PROFILE_GEEKMAGIC_PRO=1
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_DC=2
  -D TFT_RST=4
  -D TFT_CS=-1
  -D TFT_BL=25
  -D TFT_BACKLIGHT_ON=LOW
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
