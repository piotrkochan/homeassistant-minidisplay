name: CI

on:
  pull_request:
    paths: &code-paths
      - '.github/workflows/**'
      - 'firmware/**'
      - 'custom_components/**'
      - 'integration/card/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'Makefile'
      - 'hacs.json'
  push:
    branches: ['**']
    paths: *code-paths
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_firmware:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    if: '!inputs.skip_firmware'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firmware/web/package-lock.json
      - run: python -m pip install platformio==6.1.19
      - run: npm ci --prefix firmware/web
      - name: Build SD PRO and check device UI
        run: make PIO=pio build
      - name: Native tests with address and undefined-behavior sanitizers
        run: make test-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdpro-test-build
          path: firmware/.pio/build/sdpro/firmware.bin
          retention-days: 7
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integration/card/package-lock.json
      - run: npm ci --prefix integration/card
      - run: python -m pip install Pillow==11.3.0
      - run: make card-check card-build
      - name: Install browser test runner
        run: |
          npm install --prefix .cache/browser --no-package-lock playwright@1.61.1
          .cache/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Preview drag and resize regression tests
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.cache/browser/node_modules/playwright
        run: node integration/card/tests/preview-interaction.cjs

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test in Home Assistant without live services or credentials
        run: |
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -w /repo \
            -e PYTHONPATH=/repo -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint sh ghcr.io/home-assistant/home-assistant:2026.9.0 \
            -c 'python tests/test_preview.py && python tests/test_weather.py'

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate JSON documents and integration structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ('custom_components', 'dashboard'):
              for path in Path(root).rglob('*.json'):
                  json.loads(path.read_text())
          hacs = json.loads(Path('hacs.json').read_text())
          assert isinstance(hacs['name'], str) and hacs['name'].strip()
          assert not hacs.get('content_in_root', False)
          manifest = json.loads(Path('custom_components/mini_display/manifest.json').read_text())
          assert manifest['domain'] == 'mini_display'
          for key in ('name', 'version', 'documentation', 'issue_tracker', 'codeowners'):
              assert manifest[key], key
          assert Path('custom_components/mini_display/frontend/mini-display-panel.js').is_file()
          PY
